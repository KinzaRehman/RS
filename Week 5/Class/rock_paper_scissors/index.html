<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Rock, Paper, or Scissors?</title>
                <link rel="stylesheet" href="css/main.css">
                </head>
                
                <body>
                   
                       <main>
                               <img aria-hidden="true" src="images/main.png" alt="Rock, Paper, Scissors">
                                       <h1>Rock, Paper, or Scissors?</h1>
                                               <p>
                                                           <strong>rock 🪨</strong> beats <strong>scissors ✌️</strong>,
                                                                       <strong>scissors ✌️</strong> beats <strong>paper 📄</strong>,
                                                                                   and <strong>paper 📄</strong> beats <strong>rock 🪨</strong>.
                                                                                           </p>
                                                                                               </main>
                                                                                               
                                                                                                   <section class="instructions">
                                                                                                           <section class="scoreboard">
                                                                                                                       <h2>Scoreboard</h2>
                                                                                                                       
                                                                                                                                   <table>
                                                                                                                                                   <thead>
                                                                                                                                                                       <tr>
                                                                                                                                                                                               <th scope="col">You</th>
                                                                                                                                                                                                                       <th scope="col">Bot</th>
                                                                                                                                                                                                                                           </tr>
                                                                                                                                                                                                                                                           </thead>
                                                                                                                                                                                                                                                           
                                                                                                                                                                                                                                                                           <tbody>
                                                                                                                                                                                                                                                                                               <tr>
                                                                                                                                                                                                                                                                                                                       <td id="humanScore">0</td>
                                                                                                                                                                                                                                                                                                                                               <td id="computerScore">0</td>
                                                                                                                                                                                                                                                                                                                                                                   </tr>
                                                                                                                                                                                                                                                                                                                                                                                   </tbody>
                                                                                                                                                                                                                                                                                                                                                                                               </table>
                                                                                                                                                                                                                                                                                                                                                                                                       </section>
                                                                                                                                                                                                                                                                                                                                                                                                       
                                                                                                                                                                                                                                                                                                                                                                                                               <section class="game">
                                                                                                                                                                                                                                                                                                                                                                                                                           <h2>Choose Wisely</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                           
                                                                                                                                                                                                                                                                                                                                                                                                                                       <button id="rock" type="button">Rock</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                   <button id="paper" type="button">Paper</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                               <button id="scissors" type="button">Scissors</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                               
                                                                                                                                                                                                                                                                                                                                                                                                                                                                           <section class="choices">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           <figure>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               <figcaption>Your choice</figcaption>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   <img
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           id="playerImage"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   src="images/Rock.png"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           alt="Your selected weapon"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               >
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               </figure>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               <figure>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   <figcaption>Bot's choice</figcaption>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       <img
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               id="botImage"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       src="images/Rock.png"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               alt="The bot's selected weapon"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   >
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   </figure>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           <p id="status" aria-live="polite">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           Select your weapon to begin!
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       </p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           <script src="js/main.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           </html>>
