<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description" content="My To-Do List App">
    <meta name="keywords" content="todo, list, tasks">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header> 
        <h1>A running to do list </h1>
    </header>
	<!--the person probably has to see whats done and whats left -->

    <section id="countingTasks">
        <section id="numberOfTasks">
            <p>Completed: <span id="completed-counter">0</span></p>
            <p>Uncompleted: <span id="uncompleted-counter">0</span></p>
        </section>
    </section>

   <!--they need to add stuf to the list-->
    <section id="todo-container">
        <form id="todo-form">
            <input type="text" id="input-box" placeholder="Add a new task">
            <button type="button" id="input-button">Add Item</button>
        </form>

        <h2>Task List</h2>
        <ul id="list-container"></ul>
    </section>

    <script src="script.js"></script>
</body>
</html>
